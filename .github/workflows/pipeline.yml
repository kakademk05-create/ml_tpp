name: MLops Predictive Maintenance CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-ml-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python environment
      uses: actions/setup-python@v4
      with:
        python-type: '3.10'
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f PredictiveMaintenance/requirements.txt ]; then
          pip install -r PredictiveMaintenance/requirements.txt
        else
          pip install streamlit pandas numpy scikit-learn joblib
        fi

    - name: Execute Model Training and Experimentation
      run: |
        # In a real repository, this step would execute a python script, e.g. python src/train.py
        echo "Executing training pipeline, hyperparameter tuning and model optimization..."

    - name: Verify Model Artifact Integrity
      run: |
        echo "Verifying exported artifacts..."
        if [ -f PredictiveMaintenance/best_model.joblib ] && [ -f PredictiveMaintenance/scaler.joblib ]; then
          echo "✅ Success: All deployment artifacts verified!"
        else
          echo "❌ Failure: Missing model or preprocessor scaling objects!"
          exit 1
        fi
